# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
tasks:
  default:
    desc: Run Molecule tests for default scenario
    cmd: molecule test
  ufw-docker:
    desc: Run Molecule tests for ufw-docker scenario
    cmd: molecule test -s ufw-docker
  all:
    desc: Run Molecule tests for all scenarios (sequential)
    cmds:
      - task: default
      - task: ufw-docker
